name: Branch maintenance apply

on:
  push:
    branches:
      - fix/docker-stage-alias-audit

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0, Node 24
        with:
          ref: fix/docker-stage-alias-audit
          fetch-depth: 0

      - name: Apply and validate bounded parser patch
        run: |
          set -euo pipefail
          python3 scripts/apply_container_stage_alias_fix.py
          python3 -m unittest tests.test_audit
          git diff --check

      - name: Commit generated source changes to maintenance branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit.py tests/test_audit.py
          git commit -m 'fix: ignore internal Docker stage aliases'
          git push origin HEAD:fix/docker-stage-alias-audit
